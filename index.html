<style>
:root{
  --bg:#000;--bg1:#0a0a0a;--bg2:#111;--bg3:#1a1a1a;
  --line:#1e1e1e;--line2:#2a2a2a;--line3:#333;
  --text:#e8e8e8;--muted:#555;--muted2:#888;--white:#fff;
  --red:#e53935;--px:16px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Montserrat',sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
#app{height:100%;display:flex;flex-direction:column}
header{padding:calc(var(--st)+14px) calc(var(--sr)+var(--px)) 14px calc(var(--sl)+var(--px));display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);flex-shrink:0}
.wordmark{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;letter-spacing:1px;color:var(--muted2)}.wordmark b{color:var(--white)}
.hdr-right{display:flex;gap:10px}
.icon-btn{width:40px;height:40px;border-radius:8px;background:var(--bg1);border:1px solid var(--line2);color:var(--muted2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;touch-action:manipulation}
#tab-bar{display:flex;border-bottom:1px solid var(--line);flex-shrink:0;padding:0 calc(var(--sr)+var(--px)) 0 calc(var(--sl)+var(--px))}
.tab{flex:1;padding:13px 8px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.5px;color:var(--muted);text-align:center;cursor:pointer;border-bottom:2px solid transparent;transition:color .2s,border-color .2s;touch-action:manipulation}
.tab.active{color:var(--white);border-bottom-color:var(--white)}
.tab-badge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--red);font-size:9px;color:#fff;margin-left:5px;vertical-align:middle}
.tab-badge.hidden{display:none}
#sub-filter{display:flex;gap:8px;padding:12px calc(var(--sr)+var(--px)) 12px calc(var(--sl)+var(--px));overflow-x:auto;flex-shrink:0;scrollbar-width:none;border-bottom:1px solid var(--line)}
#sub-filter::-webkit-scrollbar{display:none}
.sub-pill{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid var(--line2);background:var(--bg1);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.3px;color:var(--muted2);cursor:pointer;touch-action:manipulation;transition:border-color .15s,color .15s,background .15s}
.sub-pill.active{border-color:var(--line3);background:var(--bg3);color:var(--white)}
#sort-bar{display:flex;align-items:center;justify-content:space-between;padding:10px calc(var(--sr)+var(--px)) 10px calc(var(--sl)+var(--px));flex-shrink:0;border-bottom:1px solid var(--line)}
.sort-btns{display:flex;gap:6px}
.sort-btn{padding:5px 11px;border-radius:4px;border:1px solid var(--line2);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.3px;color:var(--muted);cursor:pointer;background:none;touch-action:manipulation}
.sort-btn.active{border-color:var(--line3);color:var(--white);background:var(--bg3)}
#post-count{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)}
#scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px calc(var(--sr)+var(--px)) calc(var(--sb)+24px) calc(var(--sl)+var(--px))}
#scroll-area::-webkit-scrollbar{width:2px}#scroll-area::-webkit-scrollbar-thumb{background:var(--line2)}
#feed-view,#saved-view,#settings-view{display:none}
#feed-view.active,#saved-view.active,#settings-view.active{display:block}

.card-meta{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
.sub-tag{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.3px}

.card-media img{width:100%;display:block;max-height:500px;object-fit:contain;background:var(--bg2)}
.vid-wrap{position:relative;cursor:pointer;background:var(--bg2);min-height:160px;display:flex;align-items:center;justify-content:center;overflow:hidden}

.card-actions{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.action-btn{display:flex;align-items:center;gap:5px;padding:8px 12px;border-radius:6px;border:1px solid var(--line2);background:none;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.3px;color:var(--muted2);cursor:pointer;touch-action:manipulation;transition:border-color .15s,color .15s;white-space:nowrap;text-decoration:none}

.action-btn.saved{border-color:#555;color:var(--white);background:var(--bg3)}

.spinner{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);border-top-color:var(--muted2);animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-msg{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);text-align:center;line-height:2}
.s-section{margin-bottom:28px}.s-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:10px}.s-label::after{content:'';flex:1;height:1px;background:var(--line)}
.s-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:var(--bg1);border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.s-row-label{font-size:13px;color:var(--text)}.s-row-sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);margin-top:3px}
.toggle{width:42px;height:24px;border-radius:12px;background:var(--bg3);border:1px solid var(--line2);cursor:pointer;position:relative;flex-shrink:0;transition:background .2s}
.toggle.on{background:#2a2a2a;border-color:#444}.toggle::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}.toggle.on::after{transform:translateX(18px);background:var(--white)}
.sub-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sub-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;border:1px solid var(--line2);background:var(--bg1);font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted2)}
.sub-chip-rm{cursor:pointer;color:var(--muted);font-size:13px;line-height:1;touch-action:manipulation}
.sub-add-row{display:flex;gap:10px;margin-top:12px}
.sub-add-row input{flex:1;padding:11px 14px;background:var(--bg);border:1px solid var(--line2);border-radius:8px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;outline:none}
.sub-add-row input:focus{border-color:var(--line3)}
.btn-block{width:100%;padding:14px;border-radius:8px;font-family:'Montserrat',sans-serif;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;outline:none;margin-top:8px;touch-action:manipulation}
.btn-danger{background:none;border:1px solid #3a1515;color:#c44}
/* modal overlay for image viewer */
#img-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:100;flex-direction:column;align-items:center;justify-content:center}
#img-modal.open{display:flex}
#img-modal img{max-width:100%;max-height:90vh;object-fit:contain;border-radius:4px}
#img-modal-close{position:absolute;top:calc(var(--st)+14px);right:16px;width:40px;height:40px;border-radius:50%;background:var(--bg3);border:1px solid var(--line2);color:var(--white);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#img-modal-dl{position:absolute;bottom:calc(var(--sb)+24px);right:16px;padding:12px 20px;border-radius:8px;background:var(--bg3);border:1px solid var(--line2);color:var(--white);font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:8px}
#toast{position:fixed;bottom:calc(var(--sb)+24px);left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg3);border:1px solid var(--line2);border-radius:20px;padding:10px 20px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text);white-space:nowrap;box-shadow:0 4px 24px rgba(0,0,0,.9);transition:transform .35s cubic-bezier(.22,1,.36,1);z-index:999;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>

<script>
/* ═══════════════════════════════════════════════
   MEMEBASE v2.0
   Fixes: áudio de vídeo sincronizado, download de imagem via modal
═══════════════════════════════════════════════ */

const DEFAULT_SUBS = ['eu_nvr','diretodozapzap','botecodoreddit','MemesBrasil','MemesBR','MEMEBRASIL','antimemeBR','ShitpostBR'];

/* ── JSONP ── */
let _cbId = 0;
function jsonp(url, timeout = 10000) {
  return new Promise((resolve, reject) => {
    const cb = '__rdp' + (++_cbId);
    const t = setTimeout(() => { cleanup(); reject(new Error('timeout')) }, timeout);
    function cleanup() { clearTimeout(t); delete window[cb]; s?.remove() }
    let s;
    window[cb] = data => { cleanup(); resolve(data) };
    s = document.createElement('script');
    s.onerror = () => { cleanup(); reject(new Error('network error')) };
    const sep = url.includes('?') ? '&' : '?';
    s.src = url + sep + 'jsonp=' + cb;
    document.head.appendChild(s);
  });
}

/* ── State ── */
const S = {
  subs:      JSON.parse(localStorage.getItem('mb_subs')  || 'null') || [...DEFAULT_SUBS],
  saved:     JSON.parse(localStorage.getItem('mb_saved') || '[]'),
  cfg:       JSON.parse(localStorage.getItem('mb_cfg')   || '{"nsfw":false,"limit":25}'),
  activeSub: 'all', activeSort: 'hot', activeTab: 'feed',
  posts: [], loading: false,
};

/* ── Helpers ── */
const $ = id => document.getElementById(id);
let toastT;
const toast = msg => {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 3000);
};
const saveSubs  = () => localStorage.setItem('mb_subs',  JSON.stringify(S.subs));
const saveSaved = () => localStorage.setItem('mb_saved', JSON.stringify(S.saved));
const saveCfg   = () => localStorage.setItem('mb_cfg',   JSON.stringify(S.cfg));
const isSaved   = id => S.saved.some(p => p.data.id === id);
const fmtScore  = n  => n >= 1000 ? (n/1000).toFixed(1)+'k' : String(n);
const esc       = s  => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const unesc     = s  => s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');

/* ── Media utils ── */
function mediaType(p) {
  const d = p.data;
  if (d.is_video || d.post_hint === 'hosted:video') return 'video';
  if (/\.(mp4|webm|gifv)(\?|$)/i.test(d.url||'')) return 'video';
  if (d.post_hint === 'image' || /\.(jpg|jpeg|png|gif|webp)(\?|$)/i.test(d.url||'')) return 'image';
  if (d.preview?.images?.[0]) return 'image';
  return 'link';
}

function imgUrl(p) {
  const d = p.data;
  if (/\.(jpg|jpeg|png|gif|webp)(\?|$)/i.test(d.url||'')) return d.url;
  const src = d.preview?.images?.[0]?.source?.url || '';
  return src ? unesc(src) : null;
}

function thumbUrl(p) {
  const src = p.data.preview?.images?.[0]?.source?.url || '';
  if (src) return unesc(src);
  const t = p.data.thumbnail || '';
  return t.startsWith('http') ? t : null;
}

/* Extract Reddit video URLs — video + multiple audio candidates */
function extractVideoSources(d) {
  const rv = d.media?.reddit_video || d.secure_media?.reddit_video;
  let videoUrl = null;
  const audioCandidates = [];

  if (rv) {
    videoUrl = rv.fallback_url?.split('?')[0] || null;
    // Reddit stores audio at same base with different suffixes
    if (videoUrl) {
      const base = videoUrl.replace(/\/DASH_[^/?#]+/i, '');
      audioCandidates.push(
        base + '/DASH_AUDIO_128.mp4',
        base + '/DASH_audio.mp4',
        base + '/audio',
      );
    }
  }

  if (!videoUrl && /\.gifv(\?|$)/i.test(d.url||'')) videoUrl = d.url.replace('.gifv','.mp4');
  if (!videoUrl && /\.(mp4|webm)(\?|$)/i.test(d.url||'')) videoUrl = d.url;

  const pv = d.preview?.reddit_video_preview || d.preview?.images?.[0]?.variants?.mp4?.source;
  if (!videoUrl && pv?.url) videoUrl = unesc(pv.url);

  return { videoUrl, audioCandidates };
}

async function resolveVideoSources(postData, permalink) {
  let { videoUrl, audioCandidates } = extractVideoSources(postData);
  if (!videoUrl) {
    // Fetch the post JSON to get fresh data
    try {
      const j = await jsonp(`https://www.reddit.com${permalink}.json?raw_json=1`);
      const fresh = j[0]?.data?.children?.[0]?.data;
      if (fresh) ({ videoUrl, audioCandidates } = extractVideoSources(fresh));
    } catch(_) {}
  }
  return { videoUrl, audioCandidates };
}

/* ── Probe a URL via HEAD (no-cors fallback) ── */
async function urlExists(url) {
  try {
    const r = await fetch(url, { method: 'HEAD', mode: 'cors' });
    return r.ok;
  } catch {
    // cors blocked — assume it might exist and let the audio element decide
    return true;
  }
}

/* ── Fetch feed ── */
async function fetchSub(sub, sort, limit) {
  const url = `https://www.reddit.com/r/${sub}/${sort}.json?limit=${limit}&raw_json=1`;
  const j = await jsonp(url);
  return (j.data?.children || []).filter(p =>
    !p.data.stickied && (S.cfg.nsfw || !p.data.over_18)
  );
}

async function loadFeed() {
  if (S.loading) return;
  S.loading = true;
  $('feed-view').innerHTML = `<div class="loader"><div class="spinner"></div><span class="empty-msg">carregando…</span></div>`;
  S.posts = [];
  try {
    const subs = S.activeSub === 'all' ? S.subs : [S.activeSub];
    const lim  = Number(S.cfg.limit) || 25;
    const res  = await Promise.allSettled(subs.map(s => fetchSub(s, S.activeSort, lim)));
    let failed = 0;
    res.forEach(r => {
      if (r.status === 'fulfilled') S.posts.push(...r.value);
      else failed++;
    });
    S.posts.sort((a, b) => b.data.score - a.data.score);
    if (!S.posts.length && failed === subs.length) throw new Error('todos os subs falharam');
    renderFeed();
  } catch(e) {
    $('feed-view').innerHTML = `<div class="loader"><span class="empty-msg">erro ao carregar<br>${esc(e.message)}</span></div>`;
  }
  S.loading = false;
}

/* ── Render ── */
function renderFeed() {
  $('post-count').textContent = `${S.posts.length} posts`;
  if (!S.posts.length) {
    $('feed-view').innerHTML = `<div class="loader"><span class="empty-msg">nenhum post encontrado</span></div>`;
    return;
  }
  $('feed-view').innerHTML = S.posts.map(cardHtml).join('');
  bindCards($('feed-view'));
}

function renderSaved() {
  updateBadge();
  if (!S.saved.length) {
    $('saved-view').innerHTML = `<div class="loader"><span class="empty-msg">nada salvo ainda.\nsalve posts do feed.</span></div>`;
    return;
  }
  $('saved-view').innerHTML = S.saved.slice().reverse().map(cardHtml).join('');
  bindCards($('saved-view'));
}

function cardHtml(p) {
  const d = p.data, type = mediaType(p), saved = isSaved(d.id);
  const permalink = `https://reddit.com${d.permalink}`;
  let media = '';

  if (type === 'image') {
    const url = imgUrl(p);
    media = url
      ? `<div class="card-media"><img src="${esc(url)}" loading="lazy" data-full="${esc(url)}" class="img-clickable" style="cursor:zoom-in"/></div>`
      : '';
  } else if (type === 'video') {
    const thumb = thumbUrl(p);
    media = `<div class="card-media">
      <div class="vid-wrap" data-permalink="${esc(d.permalink)}" data-id="${esc(d.id)}">
        ${thumb ? `<img src="${esc(thumb)}" loading="lazy"/>` : `<div class="vid-placeholder">🎬</div>`}
        <div class="vid-play-btn">▶</div>
        <span class="media-badge">VÍD</span>
      </div></div>`;
  } else {
    const thumb = d.thumbnail?.startsWith('http')
      ? `<img src="${esc(d.thumbnail)}" style="width:40px;height:40px;object-fit:cover;border-radius:4px;flex-shrink:0" loading="lazy"/>`
      : `<span style="font-size:20px">🔗</span>`;
    media = `<div class="link-wrap"><a class="link-inner" href="${esc(d.url)}" target="_blank" rel="noopener">${thumb}<span>${esc(d.domain||d.url||'link')}</span></a></div>`;
  }

  return `<div class="post-card" data-id="${d.id}">
    <div class="card-meta">
      <span class="sub-tag">r/${esc(d.subreddit)}</span>
      <span class="card-score">▲ ${fmtScore(d.score)}</span>
    </div>
    <div class="card-title">${esc(d.title)}</div>
    ${media}
    <div class="card-actions">
      <button class="action-btn btn-save${saved?' saved':''}" data-id="${d.id}">${saved ? '★ salvo' : '☆ salvar'}</button>
      ${type === 'image' ? `<button class="action-btn btn-img-dl" data-id="${d.id}">↓ img</button>` : ''}
      ${type === 'video' ? `<button class="action-btn btn-vid-dl" data-id="${d.id}" data-permalink="${esc(d.permalink)}">↓ vid</button>` : ''}
      <div class="action-spacer"></div>
      <button class="action-btn btn-share" data-permalink="${esc(d.permalink)}" data-title="${esc(d.title)}">𝕏</button>
      <a class="action-btn" href="${esc(permalink)}" target="_blank" rel="noopener">↗</a>
    </div>
  </div>`;
}

function bindCards(root) {
  root.querySelectorAll('.btn-save').forEach(b =>
    b.addEventListener('click', e => { e.stopPropagation(); toggleSave(b.dataset.id, b) }));
  root.querySelectorAll('.btn-img-dl').forEach(b =>
    b.addEventListener('click', e => { e.stopPropagation(); dlImage(b) }));
  root.querySelectorAll('.btn-vid-dl').forEach(b =>
    b.addEventListener('click', e => { e.stopPropagation(); dlVideo(b) }));
  root.querySelectorAll('.btn-share').forEach(b =>
    b.addEventListener('click', e => { e.stopPropagation(); shareX(b.dataset.permalink, b.dataset.title) }));
  root.querySelectorAll('.vid-wrap').forEach(el =>
    el.addEventListener('click', () => playVideo(el)));
  root.querySelectorAll('.img-clickable').forEach(img =>
    img.addEventListener('click', () => openImgModal(img.dataset.full)));
}

/* ═══════════════════════════
   IMAGE MODAL + DOWNLOAD
═══════════════════════════ */
let _currentImgUrl = null;

function openImgModal(url) {
  _currentImgUrl = url;
  $('img-modal-img').src = url;
  $('img-modal').classList.add('open');
}
$('img-modal-close').addEventListener('click', () => $('img-modal').classList.remove('open'));
$('img-modal').addEventListener('click', e => { if (e.target === $('img-modal')) $('img-modal').classList.remove('open') });

$('img-modal-dl').addEventListener('click', async () => {
  if (!_currentImgUrl) return;
  await downloadUrl(_currentImgUrl, 'meme.jpg');
});

function dlImage(btn) {
  const post = S.posts.find(x => x.data.id === btn.dataset.id) || S.saved.find(x => x.data.id === btn.dataset.id);
  if (!post) return;
  const url = imgUrl(post);
  if (!url) { toast('url não encontrada'); return; }
  openImgModal(url); // open modal so user can tap "baixar" or long-press
}

/* ─── Universal download helper ─── */
async function downloadUrl(url, filename) {
  toast('baixando…');
  try {
    // Try fetch → blob → anchor (works when CORS is open)
    const r = await fetch(url, { mode: 'cors' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove() }, 2000);
    toast('download concluído ✓');
  } catch {
    // Reddit blocks CORS downloads — open in new tab as fallback
    window.open(url, '_blank', 'noopener');
    toast('aberto em nova aba — salve com long-press');
  }
}

/* ═══════════════════════════
   VIDEO PLAYBACK WITH AUDIO
   Strategy:
   1. Load video in <video> (muted so autoplay works)
   2. In parallel, probe audio URL candidates via HEAD
   3. Sync <audio> element to video play/pause/seek
   4. On first user interaction unmute video
═══════════════════════════ */
async function playVideo(el) {
  const { permalink, id } = el.dataset;
  el.innerHTML = `<div class="vid-loading-overlay"><div class="spinner"></div><span class="vid-loading-txt">buscando vídeo…</span></div>`;
  el.style.cursor = 'default';

  const post = S.posts.find(x => x.data.id === id) || S.saved.find(x => x.data.id === id);

  try {
    const { videoUrl, audioCandidates } = await resolveVideoSources(post?.data || {}, permalink);
    if (!videoUrl) throw new Error('URL de vídeo não encontrada');

    // Build player HTML
    const wrapper = document.createElement('div');
    wrapper.className = 'vid-player-wrap';
    wrapper.innerHTML = `
      <video playsinline preload="auto"
        style="width:100%;display:block;max-height:500px;background:#000;outline:none"></video>
      <div class="vid-audio-note" id="an_${id}">🔇 toque no vídeo para ativar o áudio</div>`;

    el.parentElement.replaceChild(wrapper, el);

    const vid  = wrapper.querySelector('video');
    const note = wrapper.querySelector('.vid-audio-note');

    // Set video source and start playing muted
    vid.src = videoUrl;
    vid.muted = true;
    vid.controls = true;
    try { await vid.play() } catch(_) {}

    // ── Audio sync ──
    // We try each audio candidate and use the first that loads
    let aud = null;
    let audioReady = false;

    const tryAudio = async () => {
      for (const audioUrl of audioCandidates) {
        const exists = await urlExists(audioUrl);
        if (!exists) continue;

        const a = new Audio();
        a.src = audioUrl;
        a.preload = 'auto';
        a.volume = vid.volume;
        a.muted = true; // start muted

        const loaded = await new Promise(resolve => {
          a.addEventListener('canplay', () => resolve(true), { once: true });
          a.addEventListener('error',   () => resolve(false), { once: true });
          setTimeout(() => resolve(false), 5000);
          a.load();
        });

        if (loaded) { aud = a; break }
      }

      if (!aud) {
        note.textContent = '(sem áudio separado)';
        return;
      }

      audioReady = true;
      note.textContent = '🔇 toque no vídeo para ativar o áudio';

      // Sync helpers
      const syncTime = () => {
        if (Math.abs(aud.currentTime - vid.currentTime) > 0.3)
          aud.currentTime = vid.currentTime;
      };
      vid.addEventListener('play',        () => { syncTime(); aud.play().catch(()=>{}) });
      vid.addEventListener('pause',       () => aud.pause());
      vid.addEventListener('seeked',      () => { aud.currentTime = vid.currentTime });
      vid.addEventListener('ratechange',  () => { aud.playbackRate = vid.playbackRate });
      vid.addEventListener('volumechange',() => { if (!aud.muted) { aud.volume = vid.volume } });
      vid.addEventListener('ended',       () => aud.pause());

      // Sync current position
      if (!vid.paused) { aud.currentTime = vid.currentTime; aud.play().catch(()=>{}) }
    };

    tryAudio(); // non-blocking

    // ── Unmute on first user tap ──
    let unmuted = false;
    const unmute = () => {
      if (unmuted) return;
      unmuted = true;
      vid.muted = false;
      if (aud && audioReady) {
        aud.muted = false;
        aud.volume = 1;
        aud.currentTime = vid.currentTime;
        if (!vid.paused) aud.play().catch(()=>{});
      }
      note.textContent = audioReady ? '🔊 áudio ativo' : '(sem áudio separado)';
      setTimeout(() => { note.style.display = 'none' }, 2000);
    };
    wrapper.addEventListener('click', unmute, { once: true });

  } catch(e) {
    el.innerHTML = `<div class="vid-error">
      Reprodução indisponível aqui.<br>
      <a href="https://reddit.com${permalink}" target="_blank" rel="noopener">▶ Abrir no Reddit</a>
    </div>`;
    toast('erro: ' + e.message);
  }
}

/* ── Video download ── */
async function dlVideo(btn) {
  const { id, permalink } = btn.dataset;
  const post = S.posts.find(x => x.data.id === id) || S.saved.find(x => x.data.id === id);
  if (!post) return;
  btn.classList.add('loading'); const orig = btn.textContent; btn.textContent = '…';
  try {
    const { videoUrl } = await resolveVideoSources(post.data, permalink);
    if (!videoUrl) throw new Error('URL não encontrada');
    await downloadUrl(videoUrl, `meme_${id}.mp4`);
  } catch(e) { toast('erro: ' + e.message) }
  btn.classList.remove('loading'); btn.textContent = orig;
}

/* ── Save / Share ── */
function toggleSave(id, btn) {
  const p = S.posts.find(x => x.data.id === id) || S.saved.find(x => x.data.id === id);
  if (!p) return;
  if (isSaved(id)) {
    S.saved = S.saved.filter(x => x.data.id !== id);
    btn.textContent = '☆ salvar'; btn.classList.remove('saved'); toast('removido');
  } else {
    S.saved.push(p); btn.textContent = '★ salvo'; btn.classList.add('saved'); toast('salvo ✓');
  }
  saveSaved(); updateBadge();
}
function updateBadge() {
  const b = $('saved-badge'); b.textContent = S.saved.length;
  S.saved.length ? b.classList.remove('hidden') : b.classList.add('hidden');
}
function shareX(permalink, title) {
  window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(title+'\n\nhttps://reddit.com'+permalink)}`, '_blank', 'noopener');
}

/* ── Sub filter ── */
function renderFilter() {
  const el = $('sub-filter');
  const pills = [{ l: 'tudo', v: 'all' }, ...S.subs.map(s => ({ l: 'r/'+s, v: s }))];
  el.innerHTML = pills.map(p =>
    `<div class="sub-pill${p.v === S.activeSub ? ' active' : ''}" data-v="${p.v}">${p.l}</div>`
  ).join('');
  el.querySelectorAll('.sub-pill').forEach(pill =>
    pill.addEventListener('click', () => { S.activeSub = pill.dataset.v; renderFilter(); loadFeed() }));
}

/* ── Settings ── */
function renderSettings() {
  $('sub-chips').innerHTML = S.subs.map(s =>
    `<div class="sub-chip"><span>r/${s}</span><span class="sub-chip-rm" data-s="${s}">✕</span></div>`
  ).join('');
  $('sub-chips').querySelectorAll('.sub-chip-rm').forEach(b =>
    b.addEventListener('click', () => {
      S.subs = S.subs.filter(x => x !== b.dataset.s);
      saveSubs(); renderSettings(); renderFilter();
      toast('r/'+b.dataset.s+' removido');
    }));
  $('nsfw-toggle').className = 'toggle' + (S.cfg.nsfw ? ' on' : '');
  $('limit-select').value = String(S.cfg.limit || 25);
}

/* ── Tabs ── */
function switchTab(tab) {
  S.activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  $('feed-view').classList.toggle('active',     tab === 'feed');
  $('saved-view').classList.toggle('active',    tab === 'saved');
  $('settings-view').classList.toggle('active', tab === 'settings');
  $('sub-filter').style.display = tab === 'feed' ? 'flex' : 'none';
  $('sort-bar').style.display   = tab === 'feed' ? 'flex' : 'none';
  if (tab === 'saved')    renderSaved();
  if (tab === 'settings') renderSettings();
}

/* ── Wire up ── */
document.querySelectorAll('.tab').forEach(t =>
  t.addEventListener('click', () => switchTab(t.dataset.tab)));
document.querySelectorAll('.sort-btn').forEach(b =>
  b.addEventListener('click', () => {
    S.activeSort = b.dataset.sort;
    document.querySelectorAll('.sort-btn').forEach(x =>
      x.classList.toggle('active', x.dataset.sort === S.activeSort));
    loadFeed();
  }));
$('refresh-btn').addEventListener('click', loadFeed);
$('cfg-btn').addEventListener('click', () => switchTab('settings'));
$('nsfw-toggle').addEventListener('click', () => {
  S.cfg.nsfw = !S.cfg.nsfw; saveCfg(); renderSettings();
  toast('nsfw ' + (S.cfg.nsfw ? 'ativado' : 'desativado'));
});
$('limit-select').addEventListener('change', e => { S.cfg.limit = Number(e.target.value); saveCfg() });
$('add-sub-btn').addEventListener('click', () => {
  const v = $('new-sub').value.trim().replace(/^r\//,'').replace(/\s/g,'');
  if (!v) return;
  if (S.subs.includes(v)) { toast('já existe'); return }
  S.subs.push(v); saveSubs(); renderSettings(); renderFilter();
  $('new-sub').value = ''; toast('r/'+v+' adicionado');
});
$('new-sub').addEventListener('keydown', e => { if (e.key === 'Enter') $('add-sub-btn').click() });
$('clear-btn').addEventListener('click', () => {
  if (!confirm('Limpar todos os posts salvos?')) return;
  S.saved = []; saveSaved(); updateBadge(); toast('salvos apagados');
});

/* ── Init ── */
updateBadge(); renderFilter(); loadFeed();
</script>
