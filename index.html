<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>MEMEBASE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0d0d0d;--s1:#141414;--s2:#1c1c1c;--s3:#242424;
  --b1:#2a2a2a;--b2:#383838;--b3:#484848;
  --tx:#f0f0f0;--t2:#a0a0a0;--t3:#606060;
  --acc:#ffffff;--red:#e05c5c;
  --r8:8px;--r12:12px;--r16:16px;--r20:20px;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);
  --sr:env(safe-area-inset-right,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column}
mono{font-family:'JetBrains Mono',monospace}

/* ── Header ── */
#hdr{
  padding:calc(var(--st) + 16px) calc(var(--sr) + 20px) 14px calc(var(--sl) + 20px);
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg);border-bottom:1px solid var(--b1);flex-shrink:0;
}
.logo{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500;letter-spacing:2px;color:var(--t3)}
.logo b{color:var(--acc);letter-spacing:2px}
.hdr-actions{display:flex;gap:8px}
.icon-btn{
  width:38px;height:38px;border-radius:var(--r8);
  background:var(--s2);border:1px solid var(--b1);
  color:var(--t2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:17px;
  transition:background .15s,color .15s;touch-action:manipulation;
}
.icon-btn:active{background:var(--s3);color:var(--acc)}

/* ── Tabs ── */
#tabs{
  display:flex;
  padding:0 calc(var(--sr) + 20px) 0 calc(var(--sl) + 20px);
  background:var(--bg);border-bottom:1px solid var(--b1);flex-shrink:0;gap:4px;
}
.tab{
  flex:1;padding:12px 6px 11px;
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.8px;text-transform:uppercase;
  color:var(--t3);text-align:center;cursor:pointer;
  border-bottom:2px solid transparent;transition:color .2s,border-color .2s;
  touch-action:manipulation;
}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:15px;height:15px;border-radius:50%;
  background:var(--red);font-size:8px;color:#fff;
  margin-left:4px;vertical-align:middle;
}
.badge.hide{display:none}

/* ── Sub filter ── */
#sub-row{
  display:flex;gap:8px;
  padding:12px calc(var(--sr) + 20px) 12px calc(var(--sl) + 20px);
  overflow-x:auto;flex-shrink:0;scrollbar-width:none;
  background:var(--bg);border-bottom:1px solid var(--b1);
}
#sub-row::-webkit-scrollbar{display:none}
.pill{
  flex-shrink:0;padding:6px 14px;border-radius:var(--r20);
  border:1px solid var(--b1);background:var(--s1);
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.3px;
  color:var(--t2);cursor:pointer;touch-action:manipulation;
  transition:all .15s;
}
.pill.on{border-color:var(--b3);background:var(--s3);color:var(--acc)}

/* ── Sort bar ── */
#sort-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px calc(var(--sr) + 20px) 10px calc(var(--sl) + 20px);
  background:var(--bg);border-bottom:1px solid var(--b1);flex-shrink:0;
}
.sorts{display:flex;gap:6px}
.srt{
  padding:5px 12px;border-radius:var(--r8);
  border:1px solid var(--b1);
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.3px;
  color:var(--t3);cursor:pointer;background:none;
  transition:all .15s;touch-action:manipulation;
}
.srt.on{border-color:var(--b3);color:var(--acc);background:var(--s3)}
#cnt{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t3)}

/* ── Scroll ── */
#area{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:20px calc(var(--sr) + 20px) calc(var(--sb) + 32px) calc(var(--sl) + 20px);
}
#area::-webkit-scrollbar{width:2px}
#area::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
.view{display:none}.view.on{display:block}

/* ── Post card ── */
.card{
  background:var(--s1);border:1px solid var(--b1);border-radius:var(--r16);
  margin-bottom:16px;overflow:hidden;
  transition:border-color .15s;
}
.card:active{border-color:var(--b3)}
.cmeta{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 6px;
}
.sub-lbl{
  font-family:'JetBrains Mono',monospace;font-size:10px;
  color:var(--t3);letter-spacing:.3px;
}
.score{
  display:flex;align-items:center;gap:4px;
  font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t2);
}
.ctitle{
  padding:6px 16px 12px;font-size:13px;font-weight:500;
  color:var(--tx);line-height:1.5;
}
.cimg{
  width:100%;display:block;
  max-height:540px;object-fit:contain;
  background:var(--s2);cursor:zoom-in;
}
.cimg.error{display:none}
.img-err{
  display:none;padding:28px;text-align:center;
  font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t3);
}
.cactions{
  display:flex;align-items:center;gap:8px;
  padding:12px 16px;border-top:1px solid var(--b1);
}
.abtn{
  display:flex;align-items:center;gap:5px;
  padding:7px 12px;border-radius:var(--r8);
  border:1px solid var(--b1);background:none;
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.3px;
  color:var(--t2);cursor:pointer;touch-action:manipulation;
  transition:all .15s;white-space:nowrap;text-decoration:none;
}
.abtn:active,.abtn:hover{border-color:var(--b3);color:var(--acc);background:var(--s3)}
.abtn.saved{border-color:var(--b3);color:var(--acc);background:var(--s2)}
.sp{flex:1}

/* ── Loader ── */
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:16px}
.spin{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--b2);border-top-color:var(--t2);animation:rot .75s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.emsg{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t3);text-align:center;line-height:2.2;white-space:pre-line}

/* ── Settings ── */
.ss{margin-bottom:28px}
.slbl{
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.2px;
  color:var(--t3);text-transform:uppercase;
  display:flex;align-items:center;gap:12px;margin-bottom:12px;
}
.slbl::after{content:'';flex:1;height:1px;background:var(--b1)}
.srow{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;background:var(--s1);border:1px solid var(--b1);
  border-radius:var(--r12);margin-bottom:8px;
}
.srow-l{font-size:13px;color:var(--tx)}
.srow-sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t3);margin-top:3px}
.tog{
  width:40px;height:22px;border-radius:11px;
  background:var(--s3);border:1px solid var(--b1);
  cursor:pointer;position:relative;flex-shrink:0;transition:background .2s;
}
.tog::after{
  content:'';position:absolute;top:3px;left:3px;
  width:14px;height:14px;border-radius:50%;
  background:var(--t3);transition:transform .2s,background .2s;
}
.tog.on{background:var(--s3);border-color:var(--b3)}
.tog.on::after{transform:translateX(18px);background:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{
  display:flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:var(--r20);
  border:1px solid var(--b1);background:var(--s1);
  font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t2);
}
.chip-x{cursor:pointer;color:var(--t3);font-size:14px;line-height:1;touch-action:manipulation}
.chip-x:hover{color:var(--red)}
.add-row{display:flex;gap:10px;margin-top:12px}
.add-row input{
  flex:1;padding:11px 14px;background:var(--bg);
  border:1px solid var(--b1);border-radius:var(--r8);
  color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:13px;outline:none;
  transition:border-color .15s;
}
.add-row input:focus{border-color:var(--b3)}
.add-row input::placeholder{color:var(--t3)}
.btn-danger{
  width:100%;padding:13px;border-radius:var(--r8);
  background:none;border:1px solid #3a1515;color:#c44;
  font-family:'Inter',sans-serif;font-size:13px;font-weight:500;
  cursor:pointer;margin-top:6px;touch-action:manipulation;
  transition:background .15s,border-color .15s;
}
.btn-danger:active{background:#1a0808;border-color:#6a2020}

/* ── Image modal ── */
#modal{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.95);z-index:100;
  flex-direction:column;align-items:center;justify-content:center;
}
#modal.open{display:flex}
#modal img{max-width:calc(100% - 32px);max-height:88vh;object-fit:contain;border-radius:var(--r8)}
#modal-close{
  position:absolute;top:calc(var(--st) + 14px);right:16px;
  width:40px;height:40px;border-radius:50%;
  background:var(--s3);border:1px solid var(--b2);
  color:var(--acc);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
#modal-dl{
  position:absolute;bottom:calc(var(--sb) + 24px);
  left:50%;transform:translateX(-50%);
  padding:11px 24px;border-radius:var(--r20);
  background:var(--s3);border:1px solid var(--b2);
  color:var(--acc);font-family:'JetBrains Mono',monospace;font-size:11px;
  cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;
  touch-action:manipulation;
}

/* ── Toast ── */
#toast{
  position:fixed;bottom:calc(var(--sb) + 28px);left:50%;
  transform:translateX(-50%) translateY(120px);
  background:var(--s3);border:1px solid var(--b2);border-radius:var(--r20);
  padding:10px 22px;
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--tx);
  white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,.9);
  transition:transform .3s cubic-bezier(.22,1,.36,1);z-index:999;pointer-events:none;
}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ── Settings select ── */
select{
  background:var(--s2);border:1px solid var(--b1);color:var(--tx);
  padding:6px 10px;border-radius:var(--r8);
  font-family:'JetBrains Mono',monospace;font-size:11px;outline:none;
}
</style>
</head>
<body>

<div id="hdr">
  <div class="logo"><b>MEME</b>BASE</div>
  <div class="hdr-actions">
    <button class="icon-btn" id="btn-refresh" title="Recarregar">↺</button>
    <button class="icon-btn" id="btn-cfg" title="Configurações">⚙</button>
  </div>
</div>

<div id="tabs">
  <div class="tab on" data-t="feed">Feed</div>
  <div class="tab" data-t="saved">Salvos <span class="badge hide" id="badge"></span></div>
  <div class="tab" data-t="cfg">Config</div>
</div>

<div id="sub-row"></div>

<div id="sort-row">
  <div class="sorts">
    <button class="srt on" data-s="hot">hot</button>
    <button class="srt" data-s="new">new</button>
    <button class="srt" data-s="rising">rising</button>
    <button class="srt" data-s="top">top</button>
  </div>
  <span id="cnt"></span>
</div>

<div id="area">
  <div id="vfeed" class="view on"></div>
  <div id="vsaved" class="view"></div>
  <div id="vcfg" class="view">
    <div style="padding-top:4px">
      <div class="ss">
        <div class="slbl">Subreddits</div>
        <div class="chips" id="chips"></div>
        <div class="add-row">
          <input id="inp-sub" type="text" placeholder="nome do subreddit" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="none"/>
          <button class="icon-btn" id="btn-add" style="width:44px;height:44px;flex-shrink:0">+</button>
        </div>
      </div>
      <div class="ss">
        <div class="slbl">Preferências</div>
        <div class="srow">
          <div><div class="srow-l">Mostrar NSFW</div><div class="srow-sub">conteúdo adulto</div></div>
          <div class="tog" id="tog-nsfw"></div>
        </div>
        <div class="srow">
          <div class="srow-l">Posts por subreddit</div>
          <select id="sel-limit">
            <option value="10">10</option>
            <option value="25" selected>25</option>
            <option value="50">50</option>
          </select>
        </div>
      </div>
      <div class="ss">
        <div class="slbl">Dados</div>
        <button class="btn-danger" id="btn-clear">Limpar posts salvos</button>
      </div>
      <p style="text-align:center;padding:16px 0 8px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t3)">memebase v3.1 · só imagens</p>
    </div>
  </div>
</div>

<div id="modal">
  <button id="modal-close">✕</button>
  <img id="modal-img" src="" alt=""/>
  <button id="modal-dl">↓ baixar imagem</button>
</div>

<div id="toast"></div>

<script>
const DEFAULTS = ['eu_nvr','diretodozapzap','botecodoreddit','MemesBrasil','MemesBR','MEMEBRASIL','antimemeBR','ShitpostBR'];
const LS = k => { try { return localStorage.getItem(k) } catch{ return null } };
const LSS = (k,v) => { try { localStorage.setItem(k,v) } catch{} };

const S = {
  subs:  JSON.parse(LS('mb3_subs')  || 'null') || [...DEFAULTS],
  saved: JSON.parse(LS('mb3_saved') || '[]'),
  cfg:   JSON.parse(LS('mb3_cfg')   || '{"nsfw":false,"limit":25}'),
  sub:'all', sort:'hot', tab:'feed',
  posts:[], loading:false,
};
const saveSubs  = () => LSS('mb3_subs',  JSON.stringify(S.subs));
const saveSaved = () => LSS('mb3_saved', JSON.stringify(S.saved));
const saveCfg   = () => LSS('mb3_cfg',   JSON.stringify(S.cfg));

const $  = id => document.getElementById(id);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const unesc = s => s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
const fmt = n => n >= 1000 ? (n/1000).toFixed(1)+'k' : String(n);
const hasSaved = id => S.saved.some(p => p.data.id === id);

let _tt;
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ── Fetch JSON ── */
async function redditFetch(url, ms=10000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally {
    clearTimeout(t);
  }
}

/* ── Imagem do post ── */
function imgOf(p) {
  const d = p.data;
  if (d.is_video || d.post_hint==='hosted:video' || d.post_hint==='rich:video') return null;
  if (/\.(mp4|webm|gifv)(\?|$)/i.test(d.url||'')) return null;
  if (/\.(jpg|jpeg|png|gif|webp)(\?|$)/i.test(d.url||'')) return d.url;
  const src = d.preview?.images?.[0]?.source?.url;
  if (src) return unesc(src);
  if (d.post_hint === 'image') return d.url;
  return null;
}

/* ── Fetch ── */
async function fetchSub(sub) {
  const j = await redditFetch(`https://www.reddit.com/r/${sub}/${S.sort}.json?limit=${S.cfg.limit||25}&raw_json=1`);
  return (j.data?.children||[]).filter(p => {
    if (p.data.stickied) return false;
    if (!S.cfg.nsfw && p.data.over_18) return false;
    return imgOf(p) !== null;
  });
}

async function load() {
  if (S.loading) return;
  S.loading = true;
  $('vfeed').innerHTML = `<div class="loader"><div class="spin"></div><span class="emsg">carregando…</span></div>`;
  S.posts = [];
  try {
    const subs = S.sub==='all' ? S.subs : [S.sub];
    const all = await Promise.allSettled(subs.map(fetchSub));
    all.forEach(r => { if (r.status==='fulfilled') S.posts.push(...r.value) });
    S.posts.sort((a,b) => b.data.score - a.data.score);
    renderFeed();
  } catch(e) {
    $('vfeed').innerHTML = `<div class="loader"><span class="emsg">erro ao carregar\n${esc(e.message)}</span></div>`;
  }
  S.loading = false;
}

/* ── Cards ── */
function cardHtml(p) {
  const d = p.data, url = imgOf(p);
  if (!url) return '';
  const sv = hasSaved(d.id);
  return `<div class="card">
    <div class="cmeta">
      <span class="sub-lbl">r/${esc(d.subreddit)}</span>
      <span class="score">▲ ${fmt(d.score)}</span>
    </div>
    <div class="ctitle">${esc(d.title)}</div>
    <img class="cimg" src="${esc(url)}" loading="lazy" data-full="${esc(url)}" alt=""/>
    <div class="img-err" id="ie-${d.id}">imagem indisponível</div>
    <div class="cactions">
      <button class="abtn btn-sv${sv?' saved':''}" data-id="${d.id}">${sv?'★ salvo':'☆ salvar'}</button>
      <button class="abtn btn-dl" data-url="${esc(url)}" data-id="${d.id}">↓ img</button>
      <div class="sp"></div>
      <a class="abtn" href="https://reddit.com${esc(d.permalink)}" target="_blank" rel="noopener">↗ reddit</a>
    </div>
  </div>`;
}

function bind(root) {
  root.querySelectorAll('.cimg').forEach(img => {
    img.addEventListener('click', () => openModal(img.dataset.full));
    img.addEventListener('error', () => {
      const id = img.closest('.card')?.querySelector('.btn-sv')?.dataset?.id;
      img.classList.add('error');
      if (id) { const e=$('ie-'+id); if(e) e.style.display='block' }
    });
  });
  root.querySelectorAll('.btn-sv').forEach(b => b.addEventListener('click', () => toggleSave(b.dataset.id, b)));
  root.querySelectorAll('.btn-dl').forEach(b => b.addEventListener('click', () => dlImg(b.dataset.url, b.dataset.id)));
}

function renderFeed() {
  $('cnt').textContent = S.posts.length + ' imgs';
  if (!S.posts.length) {
    $('vfeed').innerHTML = `<div class="loader"><span class="emsg">nenhuma imagem encontrada</span></div>`;
    return;
  }
  $('vfeed').innerHTML = S.posts.map(cardHtml).join('');
  bind($('vfeed'));
}

function renderSaved() {
  updateBadge();
  if (!S.saved.length) {
    $('vsaved').innerHTML = `<div class="loader"><span class="emsg">nada salvo ainda\nsalve imagens do feed</span></div>`;
    return;
  }
  $('vsaved').innerHTML = S.saved.slice().reverse().map(cardHtml).join('');
  bind($('vsaved'));
}

/* ── Modal ── */
let _murl = null;
function openModal(url) {
  _murl = url;
  $('modal-img').src = url;
  $('modal').classList.add('open');
}
$('modal-close').onclick = () => $('modal').classList.remove('open');
$('modal').addEventListener('click', e => { if(e.target===$('modal')) $('modal').classList.remove('open') });
$('modal-dl').onclick = () => { if(_murl) dlImg(_murl) };
$('modal-img').addEventListener('contextmenu', e => e.stopPropagation());

/* ── Download ── */
function dlImg(url) {
  window.open(url, '_blank', 'noopener');
  toast('segure a imagem → salvar na galeria 📥');
}

/* ── Save ── */
function toggleSave(id, btn) {
  const p = S.posts.find(x=>x.data.id===id) || S.saved.find(x=>x.data.id===id);
  if(!p) return;
  if(hasSaved(id)) {
    S.saved = S.saved.filter(x=>x.data.id!==id);
    btn.textContent='☆ salvar'; btn.classList.remove('saved'); toast('removido');
  } else {
    S.saved.push(p); btn.textContent='★ salvo'; btn.classList.add('saved'); toast('salvo ✓');
  }
  saveSaved(); updateBadge();
}
function updateBadge() {
  const b=$('badge'); b.textContent=S.saved.length;
  S.saved.length ? b.classList.remove('hide') : b.classList.add('hide');
}

/* ── Sub filter ── */
function renderFilter() {
  const el = $('sub-row');
  el.innerHTML = [{l:'Tudo',v:'all'},...S.subs.map(s=>({l:'r/'+s,v:s}))]
    .map(p=>`<div class="pill${p.v===S.sub?' on':''}" data-v="${p.v}">${p.l}</div>`)
    .join('');
  el.querySelectorAll('.pill').forEach(p =>
    p.addEventListener('click', () => { S.sub=p.dataset.v; renderFilter(); load() }));
}

/* ── Settings ── */
function renderCfg() {
  $('chips').innerHTML = S.subs.map(s =>
    `<div class="chip"><span>r/${s}</span><span class="chip-x" data-s="${s}">✕</span></div>`
  ).join('');
  $('chips').querySelectorAll('.chip-x').forEach(b =>
    b.addEventListener('click', () => {
      S.subs = S.subs.filter(x=>x!==b.dataset.s);
      saveSubs(); renderCfg(); renderFilter(); toast('r/'+b.dataset.s+' removido');
    }));
  $('tog-nsfw').className = 'tog' + (S.cfg.nsfw?' on':'');
  $('sel-limit').value = String(S.cfg.limit||25);
}

/* ── Tabs ── */
function switchTab(t) {
  S.tab = t;
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('on', el.dataset.t===t));
  ['vfeed','vsaved','vcfg'].forEach(id => $('v'+id.slice(1)) );
  $('vfeed').classList.toggle('on', t==='feed');
  $('vsaved').classList.toggle('on', t==='saved');
  $('vcfg').classList.toggle('on', t==='cfg');
  $('sub-row').style.display  = t==='feed' ? 'flex' : 'none';
  $('sort-row').style.display = t==='feed' ? 'flex' : 'none';
  if(t==='saved') renderSaved();
  if(t==='cfg') renderCfg();
}

/* ── Eventos ── */
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', ()=>switchTab(t.dataset.t)));
document.querySelectorAll('.srt').forEach(b => b.addEventListener('click', () => {
  S.sort=b.dataset.s;
  document.querySelectorAll('.srt').forEach(x=>x.classList.toggle('on',x.dataset.s===S.sort));
  load();
}));
$('btn-refresh').addEventListener('click', load);
$('btn-cfg').addEventListener('click', ()=>switchTab('cfg'));
$('tog-nsfw').addEventListener('click', ()=>{ S.cfg.nsfw=!S.cfg.nsfw; saveCfg(); renderCfg(); toast('nsfw '+(S.cfg.nsfw?'ativado':'desativado')) });
$('sel-limit').addEventListener('change', e=>{ S.cfg.limit=Number(e.target.value); saveCfg() });
$('btn-add').addEventListener('click', ()=>{
  const v=$('inp-sub').value.trim().replace(/^r\//,'').replace(/\s/g,'');
  if(!v){return}
  if(S.subs.includes(v)){toast('já existe');return}
  S.subs.push(v); saveSubs(); renderCfg(); renderFilter();
  $('inp-sub').value=''; toast('r/'+v+' adicionado');
});
$('inp-sub').addEventListener('keydown', e=>{ if(e.key==='Enter') $('btn-add').click() });
$('btn-clear').addEventListener('click', ()=>{
  if(!confirm('Limpar todos os posts salvos?')) return;
  S.saved=[]; saveSaved(); updateBadge(); toast('salvos apagados');
});

/* ── Init ── */
updateBadge(); renderFilter(); load();
</script>
</body>
</html>
